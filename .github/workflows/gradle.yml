name: "Tagged release with Gradle"

on:
  push:
    tags:
      - "v*"

jobs:
  tagged-release:
    name: "Tagged Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4 # https://github.com/gradle/actions/tree/main/setup-gradle

      - name: Distributions with Gradle Wrapper
        run: |
          cd 24w14a-24w35a/
          ./gradlew build

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: 24w14a-24w35a/build/libs/*.jar